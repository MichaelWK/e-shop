services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shop", "-d", "shop"]
      interval: 3s
      retries: 10

  migrate:
    build:
      context: .
      # use the builder stage: it has the Prisma CLI
      target: builder
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://shop:shop@db:5432/shop
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://shop:shop@db:5432/shop
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
